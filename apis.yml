name: Immunicon
description: Immunicon Corporation (NASDAQ IMMC) was a Huntingdon Valley, Pennsylvania biotechnology company
  that pioneered immunomagnetic cell-selection technology for isolating and characterizing rare circulating
  tumor cells (CTCs) from blood. It developed the CellSearch and CellTracks diagnostic platforms, licensed to
  Veridex, LLC (a Johnson & Johnson company) for oncology use. Immunicon filed for Chapter 11 bankruptcy in
  2008 and was acquired by Veridex/Johnson & Johnson; the CellSearch platform later passed to Menarini Silicon
  Biosystems. The company was backed by Canaan Partners and publishes no public API or developer surface.
